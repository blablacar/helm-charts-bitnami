{{- if .Values.kibana.privatelyExposed.enabled -}}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    istio.io/tag: stable
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: rabbitm
  action: ALLOW
  rules:
    - when:
        - key: request.auth.claims[groups]
          values: {{- toYaml .Values.manager.privatelyExposed.allowedGroups | trim | nindent 12 }}
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: {{ .Release.Name }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    istio.io/tag: stable
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: rabbitmq
  jwtRules:
    - issuer: https://blablacar.onelogin.com/oidc/2
      jwksUri: https://blablacar.onelogin.com/oidc/2/certs
      forwardOriginalToken: true
      fromHeaders:
        - name: x-bbc-auth
{{- end }}
